# rknn_rk3588.yaml — RK3588 INT8 export / quantization recipe.
#
# Owner: Agent C. Stage 0 ships the skeleton only.

experiment:
  name: "rknn_rk3588"
  output_dir: "outputs/rknn_rk3588"

runtime:
  seed: 0

target:
  platform: "rk3588"
  precision: "int8"          # TDD §1.6: "尽量全 INT8"
  input_shape: [1, 3, 512, 512]
  noise_shape: [1, 4, 64, 64]

export:
  # Float ONNX first, then RKNN. C owns both steps.
  onnx_opset: 17
  onnx_float_check: true
  rknn_toolkit_version: "2.3.2"     # TDD §8.4 reference version

quantization:
  # First version: PTQ only. Enable QAT only if PTQ exceeds the
  # allowed PSNR regression (TDD §8.4 + §9.4).
  method: "ptq"
  # Calibration set: Agent A picks this from training data, never
  # from holdout_images (TDD §8.4).
  calibration_manifest: "cache/calibration/manifest.json"
  max_calibration_batches: 32

budget:
  # TDD §1.7 / §8: hard ceilings for the full per-image link
  # (student codec + denoise + decode + known-pixel composite).
  max_gmacs: 8.0
  max_dram_mb: 300
  lpddr4x_bus_gbps: 34.1    # design assumption, not measured

evaluation:
  enabled: true
  compare_to: "float_onnx"
  max_psnr_drop_db: 0.3     # TDD §9.4 gate
