# student_latent.yaml — LatentStudent-v0 recipe (TDD §6.3).
#
# Owner: Agent C. Stage 0 ships the skeleton only; C will fill in
# detailed comments and the per-stage distillation schedule.

experiment:
  name: "student_latent"
  output_dir: "outputs/student_latent"

runtime:
  seed: 0
  precision: "bf16"

data:
  batch_size: 1
  resolution: 512
  cache_manifest: "cache/teacher_cache/manifest.json"

model:
  arch: "latent_student_v0"
  codec:
    encoder_widths: [16, 32, 64]
    encoder_blocks: [1, 2, 2]
    latent_channels: 4
    decoder_widths: [64, 32, 16]
    decoder_blocks: [2, 2, 1]
  student:
    in_channels: 10          # noise(4) + masked_latent(4) + coverage(1) + depth_mean(1)
    widths: [64, 128, 192]
    blocks: [2, 2, 4]

training:
  max_steps: 20             # placeholder
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  grad_accum_steps: 8
  amp: true
  loss:
    rgb: 1.0
    latent_mse: 1.0
    include_lpips: false

evaluation:
  enabled: true
  splits: ["holdout_masks", "holdout_images"]
  seeds: [0]
