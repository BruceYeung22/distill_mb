name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-contract-tests:
    name: CPU contract + config tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal CPU test dependencies
        # Heavy ML / NPU stacks (torch, diffusers, transformers, onnx,
        # rknn) are deliberately NOT installed. The contract tests and
        # config loader only need numpy + pyyaml + pytest.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "pyyaml>=6.0" "pytest>=7.0"

      - name: Install package (editable, no deps of its own)
        run: |
          python -m pip install -e .

      - name: Run CPU contract + config tests
        run: |
          python -m pytest tests/ -x --maxfail=1 -ra
